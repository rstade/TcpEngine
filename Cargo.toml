[package]
name = "tcpcengine"
version = "0.4.1"
authors = ["Rainer Stademann <25755224+rstade@users.noreply.github.com>"]
edition = "2021"
rust-version = "1.91.1"

[lib]
name = "tcp_lib"
path = "src/lib.rs"

[[bin]]
name = "tcpengine"
path = "src/bin.rs"


[dependencies]
# we are using here e2de from branch e2d2-rs-v1 of https://github.com/rstade/NetBricks
e2d2 = { version = "=1.1.0", path = "../NetBricks/framework", features = ["performance"] }
netfcts = { version = "0.3.0", path = "src/netfcts" }
fnv = "*"
log = ">=0.4"
env_logger = ">=0.5"
ctrlc = { version = ">=3.1", features = ["termination"] }
time = ">=0.1.0"
toml = ">=0.8"
separator =  ">= 0.3"
serde = ">=1.0"
serde_derive = ">=1.0"
macaddr = { version = ">=1.0", features = ["serde"] }
uuid = { version = ">=0.7", features = ["v4", "serde"] }
bincode = "*"
serde_json = "*"
ipnet = ">=2.0"
rustyline = ">=10.1.1"
clap = ">=4.1"
rand = ">=0.8"
libc = "0.2.177"
tokio = "1.49.0"

[features]
default = ["profiling"]
profiling =[]
test-support = []
